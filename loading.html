<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collapsar StarWarsRP - Загрузка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
        }

        /* Background Video */
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        #bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Scanline and Vignette Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: radial-gradient(circle at center, rgba(10, 14, 23, 0.25) 0%, rgba(5, 7, 12, 0.85) 100%);
            pointer-events: none;
        }

        .overlay::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Tactical HUD Container */
        .hud-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 60px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .server-brand {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #f59e0b;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.6), 0 0 40px rgba(245, 158, 11, 0.3);
            text-transform: uppercase;
        }

        .brand-sub {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 3px;
            color: #38bdf8;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .server-meta {
            display: flex;
            gap: 20px;
        }

        .meta-pill {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(8px);
            padding: 10px 20px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .meta-label {
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .meta-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #f8fafc;
            margin-top: 2px;
        }

        /* Bottom Section: Loading Status & Progress Bar */
        .bottom-bar {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .status-text {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
            animation: pulse 1.5s infinite;
        }

        .file-info {
            font-size: 13px;
            color: #94a3b8;
            max-width: 700px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-top: 4px;
        }

        .percentage-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: #f59e0b;
            text-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
        }

        /* Progress Bar Track */
        .progress-track {
            width: 100%;
            height: 10px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            overflow: hidden;
            padding: 2px;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6);
        }

        .progress-fill {
            height: 100%;
            width: 5%;
            background: linear-gradient(90deg, #f59e0b 0%, #38bdf8 100%);
            border-radius: 4px;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.6);
            transition: width 0.25s ease-out;
        }

        /* Sound Control */
        .audio-btn {
            position: fixed;
            bottom: 40px;
            right: 60px;
            z-index: 20;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }
        .audio-btn:hover {
            color: #fff;
            border-color: #f59e0b;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }
    </style>
</head>
<body>
    <!-- Background Repeating Video -->
    <div id="video-container">
        <video id="bg-video" autoplay loop muted playsinline preload="auto">
            <source src="start_video.webm" type="video/webm">
        </video>
    </div>

    <!-- Cinematic Vignette -->
    <div class="overlay"></div>

    <!-- Tactical HUD -->
    <div class="hud-wrapper">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="server-brand">
                <div class="brand-title" id="server-name">COLLAPSAR RP</div>
                <div class="brand-sub">Grand Army of the Republic</div>
            </div>
            <div class="server-meta">
                <div class="meta-pill">
                    <span class="meta-label">КАРТА СЕКТОРА</span>
                    <span class="meta-val" id="map-name">Загрузка...</span>
                </div>
                <div class="meta-pill">
                    <span class="meta-label">ИГРОКОВ В СЕТИ</span>
                    <span class="meta-val" id="player-count">0 / 100</span>
                </div>
            </div>
        </div>

        <!-- Center Tactical Briefing (Removed per request) -->

        <!-- Bottom Loading Bar -->
        <div class="bottom-bar">
            <div class="status-header">
                <div>
                    <div class="status-text">
                        <span class="status-dot"></span>
                        <span id="status-title">Подключение к серверу...</span>
                    </div>
                    <div class="file-info" id="file-info">Подготовка окружения...</div>
                </div>
                <div class="percentage-text" id="percentage">0%</div>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
        </div>
    </div>

    <!-- Audio Toggle Button -->
    <button class="audio-btn" id="audio-toggle" onclick="toggleAudio()">ЗВУК ВЫКЛ</button>

    <script>
        // Ensure seamless looping without black frames or freezing
        const video = document.getElementById('bg-video');
        video.addEventListener('ended', function() {
            video.currentTime = 0;
            video.play();
        });
        video.addEventListener('error', function() {
            console.warn('Video failed to load or stalled, attempting retry...');
            setTimeout(() => { video.load(); video.play(); }, 1500);
        });

        // Audio Toggle
        function toggleAudio() {
            const btn = document.getElementById('audio-toggle');
            if (video.muted) {
                video.muted = false;
                btn.innerText = 'ЗВУК ВКЛ';
                btn.style.color = '#10b981';
                btn.style.borderColor = '#10b981';
            } else {
                video.muted = true;
                btn.innerText = 'ЗВУК ВЫКЛ';
                btn.style.color = '#94a3b8';
                btn.style.borderColor = 'rgba(255,255,255,0.15)';
            }
        }

        // Garry's Mod Loading Screen API
        let totalFiles = 0;
        let neededFiles = 0;
        let maxSlots = 100;
        let onlinePlayers = 0;

        function refreshPlayerDisplay() {
            const el = document.getElementById('player-count');
            if (el) {
                el.innerText = onlinePlayers + ' / ' + maxSlots;
            }
        }

        // Live stats fetch from web server backend
        async function fetchLiveStats() {
            try {
                const res = await fetch('/api/stats');
                if (res.ok) {
                    const data = await res.json();
                    if (data && typeof data.online === 'number') {
                        onlinePlayers = data.online;
                        refreshPlayerDisplay();
                        if (data.map && (!document.getElementById('map-name').innerText || document.getElementById('map-name').innerText === 'Загрузка...')) {
                            document.getElementById('map-name').innerText = data.map;
                        }
                    }
                }
            } catch (e) {
                // Ignore background polling errors
            }
        }
        fetchLiveStats();
        setInterval(fetchLiveStats, 3000);

        function updateProgress() {
            let percent = 10;
            if (totalFiles > 0) {
                const downloaded = Math.max(0, totalFiles - neededFiles);
                percent = Math.min(100, Math.floor((downloaded / totalFiles) * 100));
            }
            document.getElementById('percentage').innerText = percent + '%';
            document.getElementById('progress-bar').style.width = Math.max(5, percent) + '%';
        }

        // 1. Called on initial load with server details
        window.GameDetails = function(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume) {
            if (servername && servername !== "MY GARRY'S MOD SERVER") {
                document.getElementById('server-name').innerText = servername;
            }
            if (mapname) document.getElementById('map-name').innerText = mapname;
            if (maxplayers) {
                maxSlots = parseInt(maxplayers, 10) || maxSlots;
                refreshPlayerDisplay();
            }
        };

        // 2. Called when the status changes
        window.SetStatusChanged = function(status) {
            if (status) {
                document.getElementById('status-title').innerText = status;
                if (status.toLowerCase().includes('sending client info') || status.toLowerCase().includes('starting lua')) {
                    document.getElementById('percentage').innerText = '100%';
                    document.getElementById('progress-bar').style.width = '100%';
                }
            }
        };

        // 3. Called when downloading a file
        window.DownloadingFile = function(fileName) {
            document.getElementById('file-info').innerText = 'Загрузка: ' + fileName;
            if (neededFiles > 0) neededFiles--;
            updateProgress();
        };

        // 4. Total files to download
        window.SetFilesTotal = function(total) {
            totalFiles = total;
            updateProgress();
        };

        // 5. Files needed
        window.SetFilesNeeded = function(needed) {
            neededFiles = needed;
            updateProgress();
        };

        // Parse query params (e.g. ?mapname=%m&steamid=%s)
        (function() {
            const params = new URLSearchParams(window.location.search);
            const map = params.get('mapname');
            if (map && map !== '%m') {
                document.getElementById('map-name').innerText = map;
            }
        })();
    </script>
</body>
</html>
