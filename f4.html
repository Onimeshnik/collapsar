var $=function(i){return document.getElementById(i)};
var CH=[{n:'Рядовой',id:'CT-6486',rank:'Private',unit:'Рекрутская',prof:'Клон Убийца',acc:'#4dff6a',tags:['Рекрут'],bg:['Phase II стандарт','Стандартные','Phase II','Без ранца','Стандартный','Короткая']},
{n:'.NoName',id:'SG-4823',rank:'Commander',unit:'16-я Эскадрилья',prof:'Пилот',acc:'#ff9a2e',tags:['Командир','Эскадрилья'],bg:['Шлем пилота','Усиленные','Лёгкий','Штурмовой','Расширенный','Без камы']}];
var BGN=['Шлем','Наплечники','Нагрудник','Ранец','Пояс','Кама'];
var STEAM='STEAM_0:1:48273915';
var act=0,unl=2,inSq=true,cmd=true,T=1,sqName='Скорпион',conf=false;
var COL=[];[64,52,40].forEach(function(l){for(var h=0;h<360;h+=30)COL.push('hsl('+h+',85%,'+l+'%)')});
var sqCol=COL[16],palOpen=false;
var PLS=[['Tracer | SG-5120','Пилот','24 м'],['Nomad | SG-5133','Пилот','109 м'],['Shadow | CT-3310','Медик','21 м'],['Cutter | CT-7788','Сапёр','330 м'],['Ghost | CT-2201','Разведчик','86 м']];
var mem=[];
function fig(acc){return '<div class="fg" style="--acc:'+acc+'"><div class="rot"><div class="f-leg f-ll"></div><div class="f-leg f-lr"></div><div class="f-arm f-al"></div><div class="f-arm f-ar"></div><div class="f-torso"></div><div class="f-sh f-shl"></div><div class="f-sh f-shr"></div><div class="f-belt"></div><div class="f-neck"></div><div class="f-head"></div></div></div>'}
function me(){return {n:CH[act].n,p:CH[act].prof,a:CH[act].acc,r:true,me:true}}
function mkSq(c){var m=me(),o=[{n:'Tracer',p:'Пилот',a:'#6fe6ff',r:true},{n:'Nomad',p:'Медик',a:'#ff4a4a',r:false}];if(c){m.c=true;mem=[m].concat(o)}else{o[0].c=true;mem=[o[0],m,o[1]]}}
mkSq(true);
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},1700)}
function copy(t,b){var d=function(){b.classList.add('done');b.textContent='СКОПИРОВАНО';toast('Данные скопированы в буфер');setTimeout(function(){b.classList.remove('done');b.textContent='КОПИРОВАТЬ ДАННЫЕ'},1400)};function fb(){var a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();d()}if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(d,fb);else fb()}
function rProf(){var c=CH[act];$('prof').style.setProperty('--s',c.acc);$('prof').innerHTML='<div class="lb">ТЕКУЩИЙ ПРОФИЛЬ</div><h3>'+c.n+' | '+c.id+'</h3><div class="fr"><span>STEAMID</span><b>'+STEAM+'</b></div><div class="fr"><span>РАНГ</span><b>'+c.rank+'</b></div><div class="fr"><span>ПРИПИСКИ</span><b>'+c.tags.join(', ')+'</b></div><div class="fr"><span>ПРОФЕССИЯ</span><b>'+c.prof+'</b></div><div class="fr"><span>ПОДРАЗДЕЛЕНИЕ</span><b>'+c.unit+'</b></div><button class="cp" id="cpb">КОПИРОВАТЬ ДАННЫЕ</button>'}
function rChars(){var h='';CH.forEach(function(c,i){h+='<button class="ch'+(i===act?' act':'')+'" data-c="'+i+'" style="--s:'+c.acc+'"><span class="av">'+c.n.replace('.','').charAt(0).toUpperCase()+'</span><span><b>'+c.n+' | '+c.id+'</b><small>'+c.prof+' · '+c.unit+'</small></span><span class="st">'+(i===act?'АКТИВЕН':'ВЫБРАТЬ')+'</span></button>'});
 for(var k=CH.length;k<3;k++){if(k<unl)h+='<button class="ch em" data-new="1"><span class="av" style="font-size:1.6cqw;background:none;color:var(--dim)">+</span><span><b>Создать персонажа</b><small>Свободный слот</small></span></button>';else h+='<div class="ch lk" tabindex="0" data-tip="Откроется при ранге Lieutenant или с поддержкой проекта"><span class="av"><svg class="lki" viewBox="0 0 24 24"><use href="#lk"/></svg></span><span><b>Слот заблокирован</b><small>Недоступен</small></span></div>'}
 $('chars').innerHTML=h}
function rModel(){var c=CH[act];$('fgb').innerHTML=fig(c.acc);var r=$('fgb').querySelector('.rot');r.style.transform='rotateY('+ang+'deg)';$('bg').innerHTML=BGN.map(function(n,i){return '<div class="bgr"><span class="sq"></span><span><small>'+n.toUpperCase()+'</small><b>'+c.bg[i]+'</b></span></div>'}).join('');$('tags').innerHTML=c.tags.map(function(t){return '<s>'+t+'</s>'}).join('')}
function rSq(){var h='';
 if(!inSq){h='<div class="cr card" style="--c:'+sqCol+';--s:'+sqCol+'"><div class="lb">ТАКТИЧЕСКИЙ ОТРЯД</div><h2>Формирование отряда</h2><p>Вы пока не состоите в отряде. Придумайте название, выберите цвет и пригласите до четырёх бойцов.</p><div class="fld"><input id="sn" maxlength="24" placeholder="Название отряда" value="'+sqName.replace(/"/g,'')+'" aria-label="Название отряда"><button class="clb" id="clb"><i></i>Цвет отряда</button>'+(palOpen?'<div class="pal">'+COL.map(function(c){return '<button data-k="'+c+'" style="--k:'+c+'" class="'+(c===sqCol?'on':'')+'" aria-label="Цвет"></button>'}).join('')+'</div>':'')+'</div><div class="pv"><small>ПРЕДПРОСМОТР</small><span style="color:'+sqCol+'">'+(sqName||'Без названия')+'</span></div><button class="btn" id="mk"'+(sqName.trim().length<3?' disabled':'')+'>СФОРМИРОВАТЬ ОТРЯД</button></div>'}
 else{var C=mem.filter(function(m){return m.c})[0]||mem[0],sl='';
 mem.forEach(function(m){sl+='<div class="mc" style="--a:'+m.a+'">'+(m.c?'<span class="star" title="Командир">★</span>':'')+'<div class="ma"><div class="fgw">'+fig(m.a)+'</div></div><h4>'+m.n+'</h4><div class="pr">'+m.p+'</div><div class="rd '+(m.r?'on':'off')+'"><i></i>'+(m.r?'РАЦИЯ В СЕТИ':'ВЫКЛЮЧЕНА')+'</div></div>'});
 for(var k=mem.length;k<5;k++)sl+='<div class="mc em">'+(cmd?'<button data-inv="1">+ Пригласить бойца</button>':'<span>Свободный слот</span>')+'</div>';
 h='<div class="sqh card" style="--s:'+sqCol+'"><h2>'+sqName+'</h2><span class="cmb">★ КОМАНДИР: '+C.n+'</span><span class="cnt">БОЙЦОВ<b>'+mem.length+'/5</b></span></div><div class="sqg">'+sl+'</div><div class="sqb card"><span>'+(cmd?'Вы командир отряда. Приглашать бойцов может только командир.':'Вы боец отряда. Покинуть его можно в любой момент.')+'</span><button class="dng'+(conf?' cf':'')+'" id="lv">'+(conf?'ПОДТВЕРДИТЬ?':cmd?'РАСПУСТИТЬ ОТРЯД':'ПОКИНУТЬ ОТРЯД')+'</button></div>'}
 $('sq').innerHTML=h}
function rPls(){var full=mem.length>=5;$('pls').innerHTML=PLS.filter(function(p){return !mem.some(function(m){return m.n===p[0].split(' | ')[0]})}).map(function(p){return '<div class="pl"><div><b>'+p[0]+'</b><small>'+p[1]+' · '+p[2]+'</small></div><button data-add="'+p[0]+'"'+(full?' disabled':'')+'>ПРИГЛАСИТЬ</button></div>'}).join('')||'<div class="lb" style="padding:1cqw 0">Рядом никого нет</div>'}
function ind(){var b=document.querySelector('.tb.on'),i=$('ind');i.style.left=b.offsetLeft+'px';i.style.width=b.offsetWidth+'px'}
function go(n){T=n;document.querySelectorAll('.tb').forEach(function(b){b.classList.toggle('on',+b.dataset.t===n)});[1,2].forEach(function(k){$('p'+k).classList.toggle('on',k===n)});ind();if(n===2)rSq();}
var ang=0,lx=null;
$('tabs').onclick=function(e){var b=e.target.closest('.tb');if(b)go(+b.dataset.t)};
addEventListener('keydown',function(e){if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key>='1'&&e.key<='2')go(+e.key)});
$('prof').onclick=function(e){var b=e.target.closest('#cpb');if(!b)return;var c=CH[act];copy('Имя: '+c.n+' | '+c.id+'\nSteamID: '+STEAM+'\nРанг: '+c.rank+'\nПрофессия: '+c.prof+'\nПодразделение: '+c.unit,b)};
$('chars').onclick=function(e){var b=e.target.closest('.ch');if(!b)return;if(b.dataset.c!==undefined&&+b.dataset.c!==act){act=+b.dataset.c;rProf();rChars();rModel();mkSqKeep();toast('Активный персонаж: '+CH[act].n+' | '+CH[act].id)}else if(b.dataset.new){CH.push({n:'Новый боец',id:'CT-'+(1000+Math.floor(Math.random()*8999)),rank:'Private',unit:'Рекрутская',prof:'Пехотинец',acc:'#b4becd',tags:['Рекрут'],bg:['Phase II стандарт','Стандартные','Phase II','Без ранца','Стандартный','Короткая']});rChars();toast('Персонаж создан')}};
function mkSqKeep(){var c=CH[act];mem.forEach(function(x){if(x.me){x.n=c.n;x.p=c.prof;x.a=c.acc}})}
var vw=$('view');
vw.onpointerdown=function(e){lx=e.clientX;vw.setPointerCapture(e.pointerId)};
vw.onpointermove=function(e){if(lx===null)return;ang+=(e.clientX-lx)*.7;lx=e.clientX;var r=$('fgb').querySelector('.rot');r.style.transform='rotateY('+ang+'deg)';vw.querySelector('.hr1').style.setProperty('--a',ang+'deg')};
vw.onpointerup=vw.onpointercancel=function(){lx=null};
$('sq').onclick=function(e){var b=e.target.closest('button');if(!b)return;
 if(b.id==='clb'){palOpen=!palOpen;rSq()}
 else if(b.dataset.k){sqCol=b.dataset.k;palOpen=false;rSq()}
 else if(b.id==='mk'){inSq=true;cmd=true;mem=[Object.assign(me(),{c:true})];$('st').value='1';$('rl').value='1';toast('Отряд «'+sqName+'» сформирован');rSq()}
 else if(b.dataset.inv){rPls();$('drw').classList.add('open')}
 else if(b.id==='lv'){if(!conf){conf=true;rSq();setTimeout(function(){if(conf){conf=false;if(T===2)rSq()}},3000)}else{conf=false;inSq=false;$('st').value='0';toast(cmd?'Отряд распущен':'Вы покинули отряд');rSq()}}};
$('sq').oninput=function(e){if(e.target.id==='sn'){sqName=e.target.value;var p=$('sq').querySelector('.pv span'),m=$('mk');p.textContent=sqName||'Без названия';m.disabled=sqName.trim().length<3}};
$('dx').onclick=function(){$('drw').classList.remove('open')};
$('pls').onclick=function(e){var b=e.target.closest('[data-add]');if(!b||mem.length>=5)return;var n=b.dataset.add.split(' | ')[0],p=PLS.filter(function(x){return x[0]===b.dataset.add})[0];mem.push({n:n,p:p[1],a:'#b4becd',r:Math.random()>.4});toast(n+' присоединился к отряду');rPls();rSq()};
$('sl').onchange=function(){unl=+this.value;rChars()};
$('st').onchange=function(){inSq=this.value==='1';if(inSq)mkSq(cmd);rSq()};
$('rl').onchange=function(){cmd=this.value==='1';if(inSq)mkSq(cmd);rSq()};
function dk(){document.documentElement.style.setProperty('--dock',$('dock').offsetHeight+'px');ind()}
addEventListener('resize',dk);if(window.ResizeObserver)new ResizeObserver(dk).observe($('dock'));
rProf();rChars();rModel();rSq();dk();go(1);
</script>
